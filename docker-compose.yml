name: odoo-lab

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - odoo-db:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  odoo:
    build: ./app
    image: devsecops-odoo-lab:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
      ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD}
    # Odoo has no CLI flag for the master password, so write it into a temporary copy of the config.
    command:
      - sh
      - -c
      - |
        cp /etc/odoo/odoo.conf /tmp/odoo.conf
        printf 'admin_passwd = %s\n' "$$ODOO_MASTER_PASSWORD" >> /tmp/odoo.conf
        ODOO_RC=/tmp/odoo.conf exec /entrypoint.sh odoo
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - odoo-web:/var/lib/odoo
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend
      - backend

volumes:
  odoo-db:
  odoo-web:

networks:
  frontend:
  backend:
    internal: true # database has no route to the internet